# File location: .github/workflows/autograder.yml

name: Indigenous NLP Autograder

on:
  pull_request:
    branches:
      - main

# SECURITY: Restrict GITHUB_TOKEN permissions to read-only
permissions:
  contents: read

jobs:
  autograder:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          # CRITICAL: Downloads full git history (depth 0).
          # Required for `git diff HEAD^1 HEAD` and `git shortlog HEAD^1..HEAD` to work.
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install nbconvert pytest

      - name: Auto-convert Notebooks to Python Scripts
        run: |
          find submissions -name "HW1_assignment.ipynb" -print0 | while IFS= read -r -d '' notebook; do
            echo "Converting: $notebook"
            jupyter nbconvert --to script "$notebook"
          done

      - name: Verify converted files
        run: |
          find submissions -name "HW1_assignment.py" -print

      - name: Run autograder test suite
        run: |
          pytest tests/autograder_eval.py -v --tb=short

      - name: Execution summary
        if: always()
        run: |
          echo "Autograder execution finished."